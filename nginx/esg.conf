server {
    listen 80;
    server_name esg.meichen.beauty;

    # Frontend static files
    root /opt/esg-research-toolkit/frontend/dist;
    index index.html;
    charset utf-8;

    # Keep the hardening headers on successful responses and errors alike.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; worker-src 'self' blob:; report-uri /api/csp-report; report-to csp-endpoint;" always;
    add_header Reporting-Endpoints 'csp-endpoint="/api/csp-report"' always;

    # Browser reports have a smaller body limit than PDF uploads. An exact
    # location keeps the report endpoint clear of denial rules and SPA fallback.
    location = /api/csp-report {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8001/csp-report;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy → FastAPI on port 8001
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow large PDF uploads
        client_max_body_size 50M;
    }

    # First regex wins: never serve hidden files/directories or source/backups,
    # even when present on disk or nested under a known SPA route or /assets/.
    location ~ (?:^|/)\. {
        return 404;
    }

    location ~* \.(?:php[0-9]*|phtml|phar|sql|bak|backup|env|git|ini|log|old|swp|swo|orig|save|tmp|conf|config|ya?ml|toml|py|sh)(?:/|$) {
        return 404;
    }

    # The shell is replaced by deployments; never cache it past a release.
    location = /index.html {
        try_files $uri =404;
        # A local add_header disables inheritance; repeat the security headers.
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; worker-src 'self' blob:; report-uri /api/csp-report; report-to csp-endpoint;" always;
        add_header Reporting-Endpoints 'csp-endpoint="/api/csp-report"' always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Match all built asset paths, including extensionless/unknown suffixes.
    # Use a regex (not ^~) so the denial rules above still take precedence.
    location ~ ^/assets(?:/|$) {
        try_files $uri =404;
        # A local add_header disables inheritance; repeat the security headers.
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; worker-src 'self' blob:; report-uri /api/csp-report; report-to csp-endpoint;" always;
        add_header Reporting-Endpoints 'csp-endpoint="/api/csp-report"' always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vite assets are content-hashed; missing asset-like paths must be real 404s.
    location ~* \.(?:css|js|mjs|map|json|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot|wasm|txt|xml)$ {
        try_files $uri =404;
        # A local add_header disables inheritance; repeat the security headers.
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; worker-src 'self' blob:; report-uri /api/csp-report; report-to csp-endpoint;" always;
        add_header Reporting-Endpoints 'csp-endpoint="/api/csp-report"' always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Keep synchronized with the production routes in frontend/src/App.tsx.
    # Static routes are exact; dynamic routes take one nonempty path segment.
    location ~* ^/(?:upload|disclosures|taxonomy|lcoe|saf|companies(?:/[^/]+)?|manual|compare|benchmarks|frameworks(?:/regional)?|regional|coverage/[^/]+)/?$ {
        try_files $uri /index.html;
    }

    # Unknown application paths render the React NotFound route, while retaining
    # the original 404 status. Static-resource locations above keep their own 404s.
    location / {
        error_page 404 =404 /index.html;
        try_files $uri $uri/ =404;
    }
}
