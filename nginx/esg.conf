server {
    listen 80;
    server_name esg.meichen.beauty;

    # Do not advertise the nginx version in responses / error pages.
    server_tokens off;

    # ── Security headers (applied to every response in this server block) ──
    # certbot --nginx adds the TLS listener + HTTP→HTTPS redirect on top of this
    # block, so these headers carry over to the HTTPS site. HSTS is ignored by
    # browsers over plain HTTP, so it is safe to declare here pre-TLS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Conservative CSP for the Vite/React SPA. 'unsafe-inline' on style-src is
    # required by Tailwind's injected styles; tighten further if you remove it.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # Frontend static files
    root /opt/esg-research-toolkit/frontend/dist;
    index index.html;

    # API proxy → FastAPI on port 8001
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow large PDF uploads
        client_max_body_size 50M;
    }

    # SPA fallback — React Router handles all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
