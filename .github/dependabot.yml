# Dependency update policy.
#
# Added 2026-07-29. Before this, 22 of 24 active repos had no version-update
# config at all — only GitHub's automatic security updates, which cover
# published CVEs and nothing else. Routine upgrades therefore never happened,
# and several repos drifted far enough that the first "security" bump was also
# a major-version jump.
#
# Grouping is deliberate: ungrouped patch churn is what trains people to stop
# reading dependency PRs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # requirements-ci.txt deliberately pins ruff to 0.14.x: 0.16 turns on
      # ~70 new findings (I001/RUF012/B008/...) across the CI path, which is a
      # dedicated lint modernization pass (#104), not a toolchain bump to wave
      # through. Without this ignore, ruff 0.16 keeps riding into the
      # pip-minor-patch group and takes the whole group PR red with it — as it
      # did in #143, where a correct and wanted schemathesis + jsonschema-rs
      # pair was blocked by the ruff bump sharing its PR.
      # Remove this entry as part of #104, not before.
      - dependency-name: "ruff"
        versions: [">=0.15"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
