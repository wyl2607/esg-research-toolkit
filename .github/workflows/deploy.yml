name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      public_health_url:
        description: "Optional public /health/deploy URL to verify after deploy"
        required: false
        default: ""
      public_dashboard_url:
        description: "Optional public /report/dashboard/stats URL to verify after deploy"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v7

      - name: Check version consistency
        run: python scripts/check_version_consistency.py

      - name: Validate deploy secrets
        id: deploy_secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_DEPLOY_KEY }}" ] || [ -z "${{ secrets.VPS_DEPLOY_USER }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping VPS deploy: set VPS_HOST, VPS_DEPLOY_USER, and VPS_DEPLOY_KEY repository secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to USA VPS
        if: steps.deploy_secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          command_timeout: 30m
          envs: GITHUB_SHA
          script: |
            set -e
            cd /opt/esg-research-toolkit

            echo "→ Fetch requested revision"
            git fetch --depth=1 origin main "$GITHUB_SHA"
            git checkout --detach "$GITHUB_SHA"

            echo "→ Run unified deploy script"
            bash scripts/deploy.sh

            echo "→ Health check"
            for i in $(seq 1 10); do
              curl -sf http://127.0.0.1:8001/health && echo " ✓ Deploy complete" && exit 0
              echo "  waiting... ($i/10)"
              sleep 3
            done
            echo "✗ Health check failed" && exit 1

      - name: Verify public deploy fingerprint
        if: steps.deploy_secrets.outputs.ready == 'true' && inputs.public_health_url != ''
        env:
          PUBLIC_HEALTH_URL: ${{ inputs.public_health_url }}
          EXPECTED_GITHUB_SHA: ${{ github.sha }}
        run: |
          payload="$(curl -fsS "$PUBLIC_HEALTH_URL")"
          python - <<'PY' "$payload"
          import json
          import os
          import sys

          payload = json.loads(sys.argv[1])
          expected = os.environ["EXPECTED_GITHUB_SHA"]
          actual = payload.get("git_sha")
          if actual != expected:
              raise SystemExit(f"public deploy git_sha mismatch: expected {expected}, got {actual}")
          print(f"OK public deployed SHA: {expected}")
          PY

      - name: Verify public dashboard stats
        if: steps.deploy_secrets.outputs.ready == 'true' && inputs.public_dashboard_url != ''
        env:
          PUBLIC_DASHBOARD_URL: ${{ inputs.public_dashboard_url }}
          EXPECTED_GITHUB_SHA: ${{ github.sha }}
        run: |
          # Reuse verify_dashboard_stats.py through the pinned post-deploy check.
          # Derive /health/deploy from the same API base so this cannot validate
          # dashboard data from a different revision than the selected SHA.
          case "$PUBLIC_DASHBOARD_URL" in
            */report/dashboard/stats) ;;
            *) echo "Expected a /report/dashboard/stats URL" >&2; exit 1 ;;
          esac
          frontend_url="$(python - <<'PY'
          import os
          from urllib.parse import urlsplit
          url = urlsplit(os.environ["PUBLIC_DASHBOARD_URL"])
          print(f"{url.scheme}://{url.netloc}/")
          PY
          )"
          python scripts/qa/verify_post_deploy.py \
            --backend-url "${PUBLIC_DASHBOARD_URL%/report/dashboard/stats}" \
            --frontend-url "$frontend_url" \
            --expected-sha "$EXPECTED_GITHUB_SHA"
      - name: Deploy skipped (missing secrets)
        if: steps.deploy_secrets.outputs.ready != 'true'
        run: echo "Deploy step skipped because required secrets are not configured."
