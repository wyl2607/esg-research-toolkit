services:
  api:
    image: esg-toolkit-api:latest
    build:
      context: .
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: sqlite:///./data/esg_toolkit.db
      # Required: production startup enforces Alembic-managed schema (e650838).
      # The VPS DB must be stamped once before the first deploy with this flag:
      #   docker compose -f docker-compose.prod.yml run --rm api alembic stamp head
      USE_ALEMBIC_INIT: "true"
    volumes:
      - /opt/esg-data:/app/data
      - /opt/esg-reports:/app/reports
      - ./.deploy-fingerprint.json:/app/.deploy-fingerprint.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
