services:
  api:
    image: esg-toolkit-api:latest
    build:
      context: .
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: sqlite:///./data/esg_toolkit.db
      # Required: production startup enforces Alembic-managed schema (e650838).
      # Before cutover: inspect schema/revision, back up, and validate on a DB copy.
      # Stamp only a verified matching revision if unversioned; then upgrade head.
      # See docs/ops/deploy-failure-analysis-2026-09-30.md section 4.
      USE_ALEMBIC_INIT: "true"
    volumes:
      - /opt/esg-data:/app/data
      - /opt/esg-reports:/app/reports
      - ./.deploy-fingerprint.json:/app/.deploy-fingerprint.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
